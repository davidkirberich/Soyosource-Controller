; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600

; ESP8266HTTPClient und ESP8266WebServer sind Teil des espressif8266-Arduino-Cores
; (framework = arduino) und werden automatisch bereitgestellt -- kein eigener
; lib_deps-Eintrag nötig/möglich (keine PlatformIO-Registry-Pakete).
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    ayushsharma82/ElegantOTA @ ^3.1.0
    jandrassy/TelnetStream @ ^1.3.0
    knolleary/PubSubClient @ ^2.8
    esp32async/ESPAsyncTCP @ ^2.0.0
    boblemaire/asyncHTTPrequest @ ^1.2.2
    olikraus/U8g2 @ ^2.35.9

build_flags =
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=0
    -D MQTT_MAX_PACKET_SIZE=512

extra_scripts = pre:get_git_version.py

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<safety_logic.cpp>
